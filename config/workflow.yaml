# Workflow settings (not policy). Policy rules live in policy/agent_policy.yaml.
workflow_version: "1.0.0"
operator_default: "Hikmat El Jabi"
trigger:
  schedule: "Every Monday 07:00 Asia/Dubai (cron: 0 7 * * 1, TZ=Asia/Dubai) — runs `python -m wab run --manifest inbox/<week>/manifest.yaml --trigger schedule`"
  manual: "Operator runs the same command with --trigger manual"
models:
  drafter: "sonnet"     # writes and revises the brief
  judges: "opus"        # three independent audit judges (a different model from the drafter)
llm_provider: "claude_cli"   # Claude Code headless, tools disabled. Alternative documented in README: openai_compatible (self-hosted vLLM)
publish:
  repo_url: "https://github.com/H-JAI-Hikmat/weekly-ai-brief"
  branch: "main"
  folder: "published"
paths:
  instruction: "policy/instruction_v1.1.md"
  rubric: "policy/rubric_v1.1.md"
  context_card: "policy/context_card.md"
  registry: "config/source_registry.yaml"
  runs: "runs"
  monitoring: "monitoring"
